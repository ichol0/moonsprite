[package]
name = "moonsprite"
version = "0.1.0-dev.4"
description = "An original, open-source pixel art workstation for Windows."
authors = ["MoonSprite contributors"]
edition = "2021"

[lib]
name = "moonsprite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.35"
arboard = "3.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_DataExchange", "Win32_System_Memory"] }
