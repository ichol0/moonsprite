name: Bug 报告
description: 报告可以稳定复现的功能错误或回归问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 简要说明实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开软件开始，逐步列出操作、工具、按键和鼠标按钮。
      placeholder: "1. 打开……\n2. 选择……\n3. 按下……"
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: 工程与画布信息
      description: 例如文件格式、画布尺寸、图层数量、选区和视图旋转状态。
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、系统缩放、MoonSprite 提交或安装包版本。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或最小工程
      description: 请删除隐私内容后上传能够稳定复现问题的材料。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认最近的 Issue 中没有相同问题。
          required: true
        - label: 我没有在附件中包含密码、密钥或隐私数据。
          required: true
